name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-service, auth-service, notification-service, transaction-service, user-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4         
      - uses: actions/setup-python@v5      
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r ${{ matrix.service }}/requirements.txt pytest pytest-asyncio
      - run: pytest -q
        working-directory: ${{ matrix.service }}
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .